name: gecko-prod-schedule-smoke
# scheduler-touch: 2026-02-14

on:
  workflow_dispatch:
  schedule:
    - cron: "7-59/10 * * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || vars.ENABLE_GH_FALLBACK_SCHEDULE == '1' }}
    timeout-minutes: 5
    steps:
      - name: UTC now
        run: |
          echo "schedule-smoke fired"
          date -u +"%Y-%m-%d %H:%M:%S UTC"

