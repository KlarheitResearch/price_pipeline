name: gecko-legacy-daily-partial

on:
  workflow_dispatch:
    inputs:
      run_daily_partial:
        description: "Run EE_gck_create_daily_from_10m.py"
        required: false
        default: "true"
      TOP_N:
        description: "Override TOP_N"
        required: false
        default: "1000"
      DAILY_CURRENT_ONLY:
        description: "Only update current partial day from 10m/live (0/1)"
        required: false
        default: "1"
      VERBOSE_MODE:
        description: "Verbose (0/1)"
        required: false
        default: "0"

permissions:
  contents: read
  actions: read

concurrency:
  group: gecko-legacy-daily-partial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.event.inputs.run_daily_partial != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      TOP_N_RESOLVED: ${{ github.event.inputs.TOP_N || '1000' }}
      DAILY_CURRENT_ONLY_RESOLVED: ${{ github.event.inputs.DAILY_CURRENT_ONLY || '1' }}
      VERBOSE_RESOLVED: ${{ github.event.inputs.VERBOSE_MODE || '0' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Astra bundle
        run: |
          echo "${{ secrets.ASTRA_BUNDLE_BASE64 }}" | base64 -d > secure-connect.zip
          test -s secure-connect.zip

      - name: EE update daily from 10m
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          TOP_N: "${{ env.TOP_N_RESOLVED }}"
          REQUEST_TIMEOUT_SEC: "40"
          CONNECT_TIMEOUT_SEC: "15"
          FETCH_SIZE: "500"
          SLOT_DELAY_SEC: "120"
          PROGRESS_EVERY: "20"
          CURRENT_ONLY: "${{ env.DAILY_CURRENT_ONLY_RESOLVED }}"
          WRITE_MCAP_DAILY: "1"
          AGG_MIN_COINS: "700"
          AGG_CARRY_FORWARD: "1"
          VERBOSE_MODE: "${{ env.VERBOSE_RESOLVED }}"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id EE_gck_create_daily_from_10m \
            -- python prices/prod_pipeline/EE_gck_create_daily_from_10m.py
