name: gecko-legacy-manual-repair

on:
  workflow_dispatch:
    inputs:
      rank_start:
        description: "Inclusive start rank"
        required: true
        default: "1"
      rank_end:
        description: "Inclusive end rank"
        required: true
        default: "100"
      coin_ids:
        description: "Optional comma-separated CoinGecko IDs (intersected with rank window)"
        required: false
        default: ""
      from_utc:
        description: "UTC start (YYYY-MM-DD or ISO timestamp)"
        required: true
        default: "2026-02-15"
      to_utc:
        description: "UTC end exclusive (YYYY-MM-DD or ISO timestamp)"
        required: true
        default: "2026-02-16"
      granularity:
        description: "Repair target"
        type: choice
        required: true
        default: both
        options:
          - 10m
          - hourly
          - both
      overwrite_existing:
        description: "Overwrite rows that already exist"
        type: choice
        required: true
        default: "false"
        options:
          - "false"
          - "true"
      dry_run:
        description: "Compute only (no writes)"
        type: choice
        required: true
        default: "true"
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: gecko-legacy-manual-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      ASTRA_TARGET: ${{ vars.ASTRA_TARGET != '' && vars.ASTRA_TARGET || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Prepare Astra env
        env:
          ASTRA_BUNDLE_BASE64_MAIN: ${{ secrets.ASTRA_BUNDLE_BASE64 }}
          ASTRA_BUNDLE_BASE64_BACKUP: ${{ secrets.ASTRA_BUNDLE_BASE64_BACKUP }}
          ASTRA_TOKEN_MAIN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_TOKEN_BACKUP: ${{ secrets.ASTRA_TOKEN_BACKUP }}
          ASTRA_KEYSPACE_MAIN: ${{ secrets.ASTRA_KEYSPACE }}
          ASTRA_KEYSPACE_BACKUP: ${{ secrets.ASTRA_KEYSPACE_BACKUP }}
        run: |
          set -euo pipefail
          MAIN_BUNDLE="secure-connect-main.zip"
          BACKUP_BUNDLE="secure-connect-backup.zip"

          echo "${ASTRA_BUNDLE_BASE64_MAIN}" | base64 -d > "${MAIN_BUNDLE}"
          test -s "${MAIN_BUNDLE}"

          if [ "${ASTRA_TARGET}" = "backup" ]; then
            if [ -z "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_BUNDLE_BASE64_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
            if [ -z "${ASTRA_TOKEN_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_TOKEN_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
          fi

          if [ -n "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
            echo "${ASTRA_BUNDLE_BASE64_BACKUP}" | base64 -d > "${BACKUP_BUNDLE}"
            test -s "${BACKUP_BUNDLE}"
          fi

          ACTIVE_BUNDLE="${MAIN_BUNDLE}"
          ACTIVE_TOKEN="${ASTRA_TOKEN_MAIN}"
          ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_MAIN}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            ACTIVE_BUNDLE="${BACKUP_BUNDLE}"
            ACTIVE_TOKEN="${ASTRA_TOKEN_BACKUP}"
            if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
              ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_BACKUP}"
            fi
          fi

          echo "ASTRA_BUNDLE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME=${ACTIVE_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME_BACKUP=${BACKUP_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_TOKEN=${ACTIVE_TOKEN}" >> "$GITHUB_ENV"
          echo "ASTRA_KEYSPACE=${ACTIVE_KEYSPACE}" >> "$GITHUB_ENV"

          if [ -n "${ASTRA_TOKEN_BACKUP:-}" ]; then
            echo "ASTRA_TOKEN_BACKUP=${ASTRA_TOKEN_BACKUP}" >> "$GITHUB_ENV"
          fi
          if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
            echo "ASTRA_KEYSPACE_BACKUP=${ASTRA_KEYSPACE_BACKUP}" >> "$GITHUB_ENV"
          fi

      - name: Log Astra target routing
        run: |
          echo "[astra-route] ASTRA_TARGET=${ASTRA_TARGET}"
          echo "[astra-route] ASTRA_KEYSPACE=${ASTRA_KEYSPACE:-unset}"
          echo "[astra-route] ASTRA_BUNDLE_NAME=${ASTRA_BUNDLE_NAME:-unset}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            echo "[astra-route] writing to BACKUP Astra DB"
          else
            echo "[astra-route] writing to MAIN Astra DB"
          fi

      - name: Run manual intraday repair
        env:
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEYS: "${{ secrets.COINGECKO_API_KEY_AA }},${{ secrets.COINGECKO_API_KEY_BB }},${{ secrets.COINGECKO_API_KEY_CC }},${{ secrets.COINGECKO_API_KEY_DD }}"
          COINGECKO_ALLOW_GENERIC_KEY_FALLBACK: "0"
          REQUEST_TIMEOUT_SEC: "45"
          FETCH_SIZE: "500"
          CG_CHUNK_HOURS: "72"
        run: |
          set -euo pipefail
          CMD=(python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id GM_gck_manual_repair_intraday \
            --rank-start "${{ github.event.inputs.rank_start }}" \
            --rank-end "${{ github.event.inputs.rank_end }}" \
            -- python prices/prod_pipeline/GM_gck_manual_repair_intraday.py \
            --rank-start "${{ github.event.inputs.rank_start }}" \
            --rank-end "${{ github.event.inputs.rank_end }}" \
            --from-utc "${{ github.event.inputs.from_utc }}" \
            --to-utc "${{ github.event.inputs.to_utc }}" \
            --granularity "${{ github.event.inputs.granularity }}")

          if [ -n "${{ github.event.inputs.coin_ids }}" ]; then
            CMD+=(--coin-ids "${{ github.event.inputs.coin_ids }}")
          fi
          if [ "${{ github.event.inputs.overwrite_existing }}" = "true" ]; then
            CMD+=(--overwrite-existing)
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD+=(--dry-run)
          fi

          "${CMD[@]}"
