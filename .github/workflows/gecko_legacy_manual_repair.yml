name: gecko-legacy-manual-repair

on:
  workflow_dispatch:
    inputs:
      rank_start:
        description: "Inclusive start rank"
        required: true
        default: "1"
      rank_end:
        description: "Inclusive end rank"
        required: true
        default: "100"
      from_utc:
        description: "UTC start (YYYY-MM-DD or ISO timestamp)"
        required: true
        default: "2026-02-15"
      to_utc:
        description: "UTC end exclusive (YYYY-MM-DD or ISO timestamp)"
        required: true
        default: "2026-02-16"
      granularity:
        description: "Repair target"
        type: choice
        required: true
        default: both
        options:
          - 10m
          - hourly
          - both
      overwrite_existing:
        description: "Overwrite rows that already exist"
        type: choice
        required: true
        default: "false"
        options:
          - "false"
          - "true"
      dry_run:
        description: "Compute only (no writes)"
        type: choice
        required: true
        default: "true"
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: gecko-legacy-manual-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Astra bundle
        run: |
          echo "${{ secrets.ASTRA_BUNDLE_BASE64 }}" | base64 -d > secure-connect.zip
          test -s secure-connect.zip

      - name: Run manual intraday repair
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEYS: "${{ secrets.COINGECKO_API_KEY_AA }},${{ secrets.COINGECKO_API_KEY_BB }},${{ secrets.COINGECKO_API_KEY_CC }},${{ secrets.COINGECKO_API_KEY_DD }},${{ secrets.COINGECKO_API_KEY }}"
          REQUEST_TIMEOUT_SEC: "45"
          FETCH_SIZE: "500"
          CG_CHUNK_HOURS: "72"
        run: |
          set -euo pipefail
          CMD=(python prices/legacy_backup/GM_gck_manual_repair_intraday.py \
            --rank-start "${{ github.event.inputs.rank_start }}" \
            --rank-end "${{ github.event.inputs.rank_end }}" \
            --from-utc "${{ github.event.inputs.from_utc }}" \
            --to-utc "${{ github.event.inputs.to_utc }}" \
            --granularity "${{ github.event.inputs.granularity }}")

          if [ "${{ github.event.inputs.overwrite_existing }}" = "true" ]; then
            CMD+=(--overwrite-existing)
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD+=(--dry-run)
          fi

          "${CMD[@]}"
