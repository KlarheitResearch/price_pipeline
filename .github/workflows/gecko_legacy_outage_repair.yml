name: gecko-legacy-outage-repair

on:
  workflow_dispatch:
    inputs:
      from_utc:
        description: "UTC start of outage window (YYYY-MM-DD or ISO timestamp)"
        required: true
        default: "2026-06-22T20:00:00Z"
      to_utc:
        description: "UTC end of outage window (YYYY-MM-DD or ISO timestamp)"
        required: true
        default: "2026-06-30T00:00:00Z"
      continuity_rank_start:
        description: "Continuity backfill rank start"
        required: false
        default: "1"
      continuity_rank_end:
        description: "Continuity backfill rank end"
        required: false
        default: "1000"
      precise_rank_end:
        description: "Precise API repair rank end"
        required: false
        default: "100"
      run_precise_hourly:
        description: "Use CoinGecko hourly repair for top ranks across outage window"
        type: choice
        required: true
        default: "true"
        options:
          - "true"
          - "false"
      run_precise_10m_recent:
        description: "Use CoinGecko 10m repair for top ranks over the most recent 24h slice"
        type: choice
        required: true
        default: "true"
        options:
          - "true"
          - "false"
      precise_replace_derived:
        description: "Replace bf_* derived rows during recent 10m repair"
        type: choice
        required: true
        default: "true"
        options:
          - "true"
          - "false"
      run_availability:
        description: "Refresh availability tables after repair"
        type: choice
        required: true
        default: "true"
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: gecko-legacy-outage-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      ASTRA_TARGET: ${{ vars.ASTRA_TARGET != '' && vars.ASTRA_TARGET || 'main' }}
      ASTRA_CONNECT_ATTEMPTS: "3"
      ASTRA_CONNECT_RETRY_BASE_SEC: "5"
      ASTRA_CONNECT_RETRY_MAX_SEC: "20"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Prepare Astra env
        env:
          ASTRA_BUNDLE_BASE64_MAIN: ${{ secrets.ASTRA_BUNDLE_BASE64 }}
          ASTRA_BUNDLE_BASE64_BACKUP: ${{ secrets.ASTRA_BUNDLE_BASE64_BACKUP }}
          ASTRA_TOKEN_MAIN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_TOKEN_BACKUP: ${{ secrets.ASTRA_TOKEN_BACKUP }}
          ASTRA_KEYSPACE_MAIN: ${{ secrets.ASTRA_KEYSPACE }}
          ASTRA_KEYSPACE_BACKUP: ${{ secrets.ASTRA_KEYSPACE_BACKUP }}
        run: |
          set -euo pipefail
          MAIN_BUNDLE="secure-connect-main.zip"
          BACKUP_BUNDLE="secure-connect-backup.zip"

          echo "${ASTRA_BUNDLE_BASE64_MAIN}" | base64 -d > "${MAIN_BUNDLE}"
          test -s "${MAIN_BUNDLE}"

          if [ "${ASTRA_TARGET}" = "backup" ]; then
            if [ -z "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_BUNDLE_BASE64_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
            if [ -z "${ASTRA_TOKEN_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_TOKEN_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
          fi

          if [ -n "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
            echo "${ASTRA_BUNDLE_BASE64_BACKUP}" | base64 -d > "${BACKUP_BUNDLE}"
            test -s "${BACKUP_BUNDLE}"
          fi

          ACTIVE_BUNDLE="${MAIN_BUNDLE}"
          ACTIVE_TOKEN="${ASTRA_TOKEN_MAIN}"
          ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_MAIN}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            ACTIVE_BUNDLE="${BACKUP_BUNDLE}"
            ACTIVE_TOKEN="${ASTRA_TOKEN_BACKUP}"
            if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
              ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_BACKUP}"
            fi
          fi

          echo "ASTRA_BUNDLE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME=${ACTIVE_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME_BACKUP=${BACKUP_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_TOKEN=${ACTIVE_TOKEN}" >> "$GITHUB_ENV"
          echo "ASTRA_KEYSPACE=${ACTIVE_KEYSPACE}" >> "$GITHUB_ENV"

          if [ -n "${ASTRA_TOKEN_BACKUP:-}" ]; then
            echo "ASTRA_TOKEN_BACKUP=${ASTRA_TOKEN_BACKUP}" >> "$GITHUB_ENV"
          fi
          if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
            echo "ASTRA_KEYSPACE_BACKUP=${ASTRA_KEYSPACE_BACKUP}" >> "$GITHUB_ENV"
          fi

      - name: Log Astra target routing
        run: |
          echo "[astra-route] ASTRA_TARGET=${ASTRA_TARGET}"
          echo "[astra-route] ASTRA_KEYSPACE=${ASTRA_KEYSPACE:-unset}"
          echo "[astra-route] ASTRA_BUNDLE_NAME=${ASTRA_BUNDLE_NAME:-unset}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            echo "[astra-route] writing to BACKUP Astra DB"
          else
            echo "[astra-route] writing to MAIN Astra DB"
          fi

      - name: Continuity backfill full outage window
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id GF_gck_backfill_raw_flat_outage \
            --rank-start "${{ github.event.inputs.continuity_rank_start }}" \
            --rank-end "${{ github.event.inputs.continuity_rank_end }}" \
            --scope outage-window \
            -- python prices/prod_pipeline/GF_gck_backfill_raw_flat.py \
              --rank-start "${{ github.event.inputs.continuity_rank_start }}" \
              --rank-end "${{ github.event.inputs.continuity_rank_end }}" \
              --from-utc "${{ github.event.inputs.from_utc }}" \
              --to-utc "${{ github.event.inputs.to_utc }}"

      - name: Precise hourly repair for top ranks
        if: ${{ github.event.inputs.run_precise_hourly == 'true' }}
        env:
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEYS: "${{ secrets.COINGECKO_API_KEY_AA }},${{ secrets.COINGECKO_API_KEY_BB }},${{ secrets.COINGECKO_API_KEY_CC }},${{ secrets.COINGECKO_API_KEY_DD }}"
          COINGECKO_ALLOW_GENERIC_KEY_FALLBACK: "0"
          REQUEST_TIMEOUT_SEC: "45"
          FETCH_SIZE: "500"
          CG_CHUNK_HOURS: "72"
          PRECISE_RANK_END: ${{ github.event.inputs.precise_rank_end || '100' }}
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id GM_gck_manual_repair_intraday_hourly_outage \
            --rank-start "1" \
            --rank-end "${{ github.event.inputs.precise_rank_end }}" \
            --scope outage-hourly \
            -- python prices/prod_pipeline/GM_gck_manual_repair_intraday.py \
              --rank-start "1" \
              --rank-end "${{ github.event.inputs.precise_rank_end }}" \
              --from-utc "${{ github.event.inputs.from_utc }}" \
              --to-utc "${{ github.event.inputs.to_utc }}" \
              --granularity hourly \
              --precise-rank-end "${{ github.event.inputs.precise_rank_end }}" \
              --overwrite-existing

      - name: Precise 10m repair for recent 24h slice
        if: ${{ github.event.inputs.run_precise_10m_recent == 'true' }}
        env:
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEYS: "${{ secrets.COINGECKO_API_KEY_AA }},${{ secrets.COINGECKO_API_KEY_BB }},${{ secrets.COINGECKO_API_KEY_CC }},${{ secrets.COINGECKO_API_KEY_DD }}"
          COINGECKO_ALLOW_GENERIC_KEY_FALLBACK: "0"
          REQUEST_TIMEOUT_SEC: "45"
          FETCH_SIZE: "500"
          CG_CHUNK_HOURS: "72"
          PRECISE_RANK_END: ${{ github.event.inputs.precise_rank_end || '100' }}
          AUTHORITATIVE_10M_MAX_HOURS: "24"
        run: |
          set -euo pipefail
          TO_EPOCH="$(date -u -d "${{ github.event.inputs.to_utc }}" +%s)"
          FROM_EPOCH="$(date -u -d "${{ github.event.inputs.from_utc }}" +%s)"
          TEN_FROM_EPOCH="$(( TO_EPOCH - 24*3600 ))"
          if [ "${TEN_FROM_EPOCH}" -lt "${FROM_EPOCH}" ]; then
            TEN_FROM_EPOCH="${FROM_EPOCH}"
          fi
          TEN_FROM_UTC="$(date -u -d "@${TEN_FROM_EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"

          CMD=(python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id GM_gck_manual_repair_intraday_10m_outage \
            --rank-start "1" \
            --rank-end "${{ github.event.inputs.precise_rank_end }}" \
            --scope outage-10m-recent \
            -- python prices/prod_pipeline/GM_gck_manual_repair_intraday.py \
            --rank-start "1" \
            --rank-end "${{ github.event.inputs.precise_rank_end }}" \
            --from-utc "${TEN_FROM_UTC}" \
            --to-utc "${{ github.event.inputs.to_utc }}" \
            --granularity 10m \
            --precise-rank-end "${{ github.event.inputs.precise_rank_end }}")

          if [ "${{ github.event.inputs.precise_replace_derived }}" = "true" ]; then
            CMD+=(--replace-derived)
          fi

          "${CMD[@]}"

      - name: Refresh live tables from repaired raw data
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id GI_gck_refresh_live_from_raw_outage \
            --rank-start "${{ github.event.inputs.continuity_rank_start }}" \
            --rank-end "${{ github.event.inputs.continuity_rank_end }}" \
            --scope outage-window \
            -- python prices/prod_pipeline/GI_gck_refresh_live_from_raw.py \
              --rank-start "${{ github.event.inputs.continuity_rank_start }}" \
              --rank-end "${{ github.event.inputs.continuity_rank_end }}"

      - name: Rebuild market-cap aggregates from repaired raw data
        env:
          TRUNCATE_TARGETS: "1"
          AGG_MIN_COINS: "700"
          REQUEST_TIMEOUT_SEC: "60"
          BATCH_FLUSH_EVERY: "50"
          COIN_WORKERS: "6"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id HH_recalculate_mcaps_outage \
            --rank-start "${{ github.event.inputs.continuity_rank_start }}" \
            --rank-end "${{ github.event.inputs.continuity_rank_end }}" \
            --scope outage-window \
            -- python prices/HH_recalculate_mcaps.py

      - name: Refresh availability tables
        if: ${{ github.event.inputs.run_availability == 'true' }}
        env:
          REQUEST_TIMEOUT_SEC: "30"
          LOG_HEARTBEAT_SEC: "20"
          AVAIL_RUN_DAILY: "1"
          AVAIL_RUN_INTRADAY: "1"
          IDS_SOURCE: "live"
          AVAIL_TOP_N: "1000"
          AVAIL_SHARD_COUNT: "1"
          AVAIL_SHARD_INDEX: "0"
          WIN_10M_DAYS: "7"
          WIN_HOURLY_DAYS: "30"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id FF_gck_coin_data_availability_outage \
            --scope outage-window \
            -- python prices/prod_pipeline/FF_gck_coin_data_availability.py
