name: gecko-legacy-core

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run AA_gck_load_prices_live.py"
        required: false
        default: "true"
      run_10m:
        description: "Run CC_gck_append_10m_from_live.py"
        required: false
        default: "true"
      run_hourly:
        description: "Run DD_gck_create_hourly_from_10m.py"
        required: false
        default: "false"
      run_daily_from_10m:
        description: "Run EE_gck_create_daily_from_10m.py"
        required: false
        default: "false"
      run_monthly:
        description: "Run EG_gck_update_monthly_from_daily.py"
        required: false
        default: "false"
      TOP_N:
        description: "Override TOP_N"
        required: false
        default: "1000"
      RANK_TOP_N:
        description: "Override RANK_TOP_N"
        required: false
        default: "1000"
      CURRENT_ONLY:
        description: "Hourly: only prev_final + curr_partial (0/1)"
        required: false
        default: "1"
      DAILY_CURRENT_ONLY:
        description: "Daily: only update current partial day from 10m/live (0/1)"
        required: false
        default: "1"
      MONTHLY_CURRENT_ONLY:
        description: "Monthly: only update current partial month (0/1)"
        required: false
        default: "1"
      VERBOSE_MODE:
        description: "Verbose (0/1)"
        required: false
        default: "0"

permissions:
  contents: read
  actions: read

concurrency:
  group: gecko-legacy-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONWARNINGS: default
      ASTRA_TARGET: ${{ vars.ASTRA_TARGET != '' && vars.ASTRA_TARGET || 'main' }}

      RUN_LIVE: ${{ github.event.inputs.run_live || 'true' }}
      RUN_10M: ${{ github.event.inputs.run_10m || 'true' }}
      RUN_HOURLY: ${{ github.event.inputs.run_hourly || 'false' }}
      RUN_DAILY_10M: ${{ github.event.inputs.run_daily_from_10m || 'false' }}
      RUN_MONTHLY: ${{ github.event.inputs.run_monthly || 'false' }}

      TOP_N_RESOLVED: ${{ github.event.inputs.TOP_N || '1000' }}
      RANK_TOP_N_RESOLVED: ${{ github.event.inputs.RANK_TOP_N || github.event.inputs.TOP_N || '1000' }}
      CURRENT_ONLY_RESOLVED: ${{ github.event.inputs.CURRENT_ONLY || '1' }}
      DAILY_CURRENT_ONLY_RESOLVED: ${{ github.event.inputs.DAILY_CURRENT_ONLY || '1' }}
      MONTHLY_CURRENT_ONLY_RESOLVED: ${{ github.event.inputs.MONTHLY_CURRENT_ONLY || '1' }}
      VERBOSE_RESOLVED: ${{ github.event.inputs.VERBOSE_MODE || '0' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Prepare Astra env
        env:
          ASTRA_BUNDLE_BASE64_MAIN: ${{ secrets.ASTRA_BUNDLE_BASE64 }}
          ASTRA_BUNDLE_BASE64_BACKUP: ${{ secrets.ASTRA_BUNDLE_BASE64_BACKUP }}
          ASTRA_TOKEN_MAIN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_TOKEN_BACKUP: ${{ secrets.ASTRA_TOKEN_BACKUP }}
          ASTRA_KEYSPACE_MAIN: ${{ secrets.ASTRA_KEYSPACE }}
          ASTRA_KEYSPACE_BACKUP: ${{ secrets.ASTRA_KEYSPACE_BACKUP }}
        run: |
          set -euo pipefail
          MAIN_BUNDLE="secure-connect-main.zip"
          BACKUP_BUNDLE="secure-connect-backup.zip"

          echo "${ASTRA_BUNDLE_BASE64_MAIN}" | base64 -d > "${MAIN_BUNDLE}"
          test -s "${MAIN_BUNDLE}"

          if [ "${ASTRA_TARGET}" = "backup" ]; then
            if [ -z "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_BUNDLE_BASE64_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
            if [ -z "${ASTRA_TOKEN_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_TOKEN_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
          fi

          if [ -n "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
            echo "${ASTRA_BUNDLE_BASE64_BACKUP}" | base64 -d > "${BACKUP_BUNDLE}"
            test -s "${BACKUP_BUNDLE}"
          fi

          ACTIVE_BUNDLE="${MAIN_BUNDLE}"
          ACTIVE_TOKEN="${ASTRA_TOKEN_MAIN}"
          ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_MAIN}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            ACTIVE_BUNDLE="${BACKUP_BUNDLE}"
            ACTIVE_TOKEN="${ASTRA_TOKEN_BACKUP}"
            if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
              ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_BACKUP}"
            fi
          fi

          echo "ASTRA_BUNDLE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME=${ACTIVE_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME_BACKUP=${BACKUP_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_TOKEN=${ACTIVE_TOKEN}" >> "$GITHUB_ENV"
          echo "ASTRA_KEYSPACE=${ACTIVE_KEYSPACE}" >> "$GITHUB_ENV"

          if [ -n "${ASTRA_TOKEN_BACKUP:-}" ]; then
            echo "ASTRA_TOKEN_BACKUP=${ASTRA_TOKEN_BACKUP}" >> "$GITHUB_ENV"
          fi
          if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
            echo "ASTRA_KEYSPACE_BACKUP=${ASTRA_KEYSPACE_BACKUP}" >> "$GITHUB_ENV"
          fi

      - name: Log Astra target routing
        run: |
          echo "[astra-route] ASTRA_TARGET=${ASTRA_TARGET}"
          echo "[astra-route] ASTRA_KEYSPACE=${ASTRA_KEYSPACE:-unset}"
          echo "[astra-route] ASTRA_BUNDLE_NAME=${ASTRA_BUNDLE_NAME:-unset}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            echo "[astra-route] writing to BACKUP Astra DB"
          else
            echo "[astra-route] writing to MAIN Astra DB"
          fi

      - name: AA load live (top 1000)
        if: env.RUN_LIVE == 'true'
        timeout-minutes: 10
        env:
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEYS: "${{ secrets.COINGECKO_API_KEY_AA }},${{ secrets.COINGECKO_API_KEY_BB }},${{ secrets.COINGECKO_API_KEY_CC }},${{ secrets.COINGECKO_API_KEY_DD }}"
          COINGECKO_ALLOW_GENERIC_KEY_FALLBACK: "0"

          TOP_N: "${{ env.TOP_N_RESOLVED }}"
          RANK_TOP_N: "${{ env.RANK_TOP_N_RESOLVED }}"

          STALE_WARN_MINUTES: "10"
          REQUIRED_LIVE_MIN: "700"
          RETRIES: "3"
          CG_BACKOFF_BASE_S: "5"
          REQUEST_TIMEOUT_SEC: "60"
          CONNECT_TIMEOUT_SEC: "15"
          BATCH_FLUSH_EVERY: "50"
          RANK_BUCKET: "all"
          VERBOSE_MODE: "${{ env.VERBOSE_RESOLVED }}"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id AA_gck_load_prices_live \
            -- python prices/prod_pipeline/AA_gck_load_prices_live.py

      - name: CC append 10m from live
        if: env.RUN_10M == 'true'
        timeout-minutes: 12
        env:
          TOP_N: "${{ env.TOP_N_RESOLVED }}"
          REQUEST_TIMEOUT_SEC: "60"
          CONNECT_TIMEOUT_SEC: "15"
          FETCH_SIZE: "500"
          SLOT_DELAY_SEC: "120"
          SLOTS_BACKFILL: "4"
          AGG_MIN_COINS: "700"
          AGG_CARRY_FORWARD: "1"
          AGG_REQUIRED_IDS: "bitcoin,ethereum"
          AGG_ENFORCE_REQUIRED_IDS: "1"
          AGG_MIN_PREV_COVERAGE_RATIO: "0.90"
          AGG_QUARANTINE_ENABLED: "1"
          AGG_QUARANTINE_ON_REQUIRED_MISS: "1"
          AGG_QUARANTINE_ON_LOW_COVERAGE: "1"
          AGG_QUARANTINE_ON_VSHAPE: "1"
          AGG_VSHAPE_DROP_PCT: "0.07"
          AGG_VSHAPE_MIN_ABS_USD: "50000000000"
          WRITE_SLOT_QUALITY: "1"
          TABLE_MCAP_10M_QUALITY: "gecko_market_cap_10m_quality"
          QUALITY_TTL_SEC: "1209600"
          PROGRESS_EVERY: "100"
          COIN_WORKERS: "8"
          WRITE_CONCURRENCY: "16"
          APPEND_SKIP_EXISTING: "1"
          APPEND_AGG_FROM_EXISTING: "0"
          REBUILD_AGG_AFTER_APPEND: "1"
          LOG_SLOT_LINES: "0"
          LOG_INSERT_LINES: "0"
          VERBOSE_MODE: "${{ env.VERBOSE_RESOLVED }}"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id CC_gck_append_10m_from_live \
            -- python prices/prod_pipeline/CC_gck_append_10m_from_live.py

      - name: DD update hourly from 10m
        if: env.RUN_HOURLY == 'true'
        timeout-minutes: 12
        env:
          TOP_N: "${{ env.TOP_N_RESOLVED }}"
          REQUEST_TIMEOUT_SEC: "40"
          CONNECT_TIMEOUT_SEC: "15"
          FETCH_SIZE: "500"
          SLOT_DELAY_SEC: "120"
          CURRENT_ONLY: "${{ env.CURRENT_ONLY_RESOLVED }}"
          FINALIZE_PREV: "1"
          PROGRESS_EVERY: "20"
          AGG_MIN_COINS: "700"
          AGG_CARRY_FORWARD: "1"
          VERBOSE_MODE: "${{ env.VERBOSE_RESOLVED }}"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id DD_gck_create_hourly_from_10m \
            -- python prices/prod_pipeline/DD_gck_create_hourly_from_10m.py

      - name: EE update daily from 10m
        if: env.RUN_DAILY_10M == 'true'
        timeout-minutes: 25
        env:
          TOP_N: "${{ env.TOP_N_RESOLVED }}"
          REQUEST_TIMEOUT_SEC: "40"
          CONNECT_TIMEOUT_SEC: "15"
          FETCH_SIZE: "500"
          SLOT_DELAY_SEC: "120"
          PROGRESS_EVERY: "20"
          CURRENT_ONLY: "${{ env.DAILY_CURRENT_ONLY_RESOLVED }}"
          WRITE_MCAP_DAILY: "1"
          AGG_MIN_COINS: "700"
          AGG_CARRY_FORWARD: "1"
          VERBOSE_MODE: "${{ env.VERBOSE_RESOLVED }}"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id EE_gck_create_daily_from_10m \
            -- python prices/prod_pipeline/EE_gck_create_daily_from_10m.py

      - name: EG update monthly from daily
        if: env.RUN_MONTHLY == 'true'
        timeout-minutes: 8
        env:
          TOP_N: "${{ env.TOP_N_RESOLVED }}"
          REQUEST_TIMEOUT_SEC: "40"
          CONNECT_TIMEOUT_SEC: "15"
          FETCH_SIZE: "500"
          CURRENT_ONLY: "${{ env.MONTHLY_CURRENT_ONLY_RESOLVED }}"
          VERBOSE_MODE: "${{ env.VERBOSE_RESOLVED }}"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id EG_gck_update_monthly_from_daily \
            -- python prices/prod_pipeline/EG_gck_update_monthly_from_daily.py
