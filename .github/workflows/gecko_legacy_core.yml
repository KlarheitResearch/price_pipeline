name: gecko-legacy-core

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run AA_gck_load_prices_live.py"
        required: false
        default: "true"
      run_10m:
        description: "Run CC_gck_append_10m_from_live.py"
        required: false
        default: "true"
      run_hourly:
        description: "Run DD_gck_create_hourly_from_10m.py"
        required: false
        default: "false"
      run_daily_from_10m:
        description: "Run EE_gck_create_daily_from_10m.py"
        required: false
        default: "false"
      run_monthly:
        description: "Run EG_gck_update_monthly_from_daily.py"
        required: false
        default: "false"
      TOP_N:
        description: "Override TOP_N"
        required: false
        default: "1000"
      RANK_TOP_N:
        description: "Override RANK_TOP_N"
        required: false
        default: "1000"
      CURRENT_ONLY:
        description: "Hourly: only prev_final + curr_partial (0/1)"
        required: false
        default: "1"
      VERBOSE_MODE:
        description: "Verbose (0/1)"
        required: false
        default: "0"

permissions:
  contents: read
  actions: read

concurrency:
  group: gecko-legacy-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONWARNINGS: default

      RUN_LIVE: ${{ github.event.inputs.run_live || 'true' }}
      RUN_10M: ${{ github.event.inputs.run_10m || 'true' }}
      RUN_HOURLY: ${{ github.event.inputs.run_hourly || 'false' }}
      RUN_DAILY_10M: ${{ github.event.inputs.run_daily_from_10m || 'false' }}
      RUN_MONTHLY: ${{ github.event.inputs.run_monthly || 'false' }}

      TOP_N_RESOLVED: ${{ github.event.inputs.TOP_N || '1000' }}
      RANK_TOP_N_RESOLVED: ${{ github.event.inputs.RANK_TOP_N || github.event.inputs.TOP_N || '1000' }}
      CURRENT_ONLY_RESOLVED: ${{ github.event.inputs.CURRENT_ONLY || '1' }}
      VERBOSE_RESOLVED: ${{ github.event.inputs.VERBOSE_MODE || '0' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Astra bundle
        run: |
          echo "${{ secrets.ASTRA_BUNDLE_BASE64 }}" | base64 -d > secure-connect.zip
          test -s secure-connect.zip

      - name: AA load live (top 1000)
        if: env.RUN_LIVE == 'true'
        timeout-minutes: 10
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY_AA != '' && secrets.COINGECKO_API_KEY_AA || secrets.COINGECKO_API_KEY }}

          TOP_N: "${{ env.TOP_N_RESOLVED }}"
          RANK_TOP_N: "${{ env.RANK_TOP_N_RESOLVED }}"

          STALE_WARN_MINUTES: "10"
          REQUIRED_LIVE_MIN: "700"
          RETRIES: "3"
          BACKOFF_MIN: "5"
          MAX_BACKOFF_MIN: "30"
          REQUEST_TIMEOUT_SEC: "60"
          CONNECT_TIMEOUT_SEC: "15"
          BATCH_FLUSH_EVERY: "50"
          RANK_BUCKET: "all"
          VERBOSE_MODE: "${{ env.VERBOSE_RESOLVED }}"
        run: python prices/legacy_backup/AA_gck_load_prices_live.py

      - name: CC append 10m from live
        if: env.RUN_10M == 'true'
        timeout-minutes: 8
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}

          TOP_N: "${{ env.TOP_N_RESOLVED }}"
          REQUEST_TIMEOUT_SEC: "60"
          CONNECT_TIMEOUT_SEC: "15"
          FETCH_SIZE: "500"
          SLOT_DELAY_SEC: "120"
          SLOTS_BACKFILL: "4"
          AGG_MIN_COINS: "700"
          AGG_CARRY_FORWARD: "1"
          VERBOSE_MODE: "${{ env.VERBOSE_RESOLVED }}"
        run: python prices/legacy_backup/CC_gck_append_10m_from_live.py

      - name: DD update hourly from 10m
        if: env.RUN_HOURLY == 'true'
        timeout-minutes: 12
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}

          TOP_N: "${{ env.TOP_N_RESOLVED }}"
          REQUEST_TIMEOUT_SEC: "40"
          CONNECT_TIMEOUT_SEC: "15"
          FETCH_SIZE: "500"
          SLOT_DELAY_SEC: "120"
          CURRENT_ONLY: "${{ env.CURRENT_ONLY_RESOLVED }}"
          FINALIZE_PREV: "1"
          PROGRESS_EVERY: "20"
          AGG_MIN_COINS: "700"
          AGG_CARRY_FORWARD: "1"
          VERBOSE_MODE: "${{ env.VERBOSE_RESOLVED }}"
        run: python prices/legacy_backup/DD_gck_create_hourly_from_10m.py

      - name: EE update daily from 10m
        if: env.RUN_DAILY_10M == 'true'
        timeout-minutes: 12
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}

          TOP_N: "${{ env.TOP_N_RESOLVED }}"
          REQUEST_TIMEOUT_SEC: "40"
          CONNECT_TIMEOUT_SEC: "15"
          FETCH_SIZE: "500"
          SLOT_DELAY_SEC: "120"
          PROGRESS_EVERY: "20"
          WRITE_MCAP_DAILY: "1"
          AGG_MIN_COINS: "700"
          AGG_CARRY_FORWARD: "1"
          VERBOSE_MODE: "${{ env.VERBOSE_RESOLVED }}"
        run: python prices/legacy_backup/EE_gck_create_daily_from_10m.py

      - name: EG update monthly from daily
        if: env.RUN_MONTHLY == 'true'
        timeout-minutes: 8
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}

          TOP_N: "${{ env.TOP_N_RESOLVED }}"
          REQUEST_TIMEOUT_SEC: "40"
          CONNECT_TIMEOUT_SEC: "15"
          FETCH_SIZE: "500"
          VERBOSE_MODE: "${{ env.VERBOSE_RESOLVED }}"
        run: python prices/legacy_backup/EG_gck_update_monthly_from_daily.py
