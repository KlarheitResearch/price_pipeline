name: gecko-legacy-maintenance

on:
  workflow_dispatch:
    inputs:
      run_continuity_backfill:
        description: "Run GF_gck_backfill_raw_flat.py"
        required: false
        default: "true"
      run_precise_repair:
        description: "Run GM_gck_manual_repair_intraday.py for top ranks only"
        required: false
        default: "true"
      run_live_refresh:
        description: "Run GI_gck_refresh_live_from_raw.py"
        required: false
        default: "true"
      run_mcap_rebuild:
        description: "Run HH_recalculate_mcaps.py"
        required: false
        default: "true"
      run_availability:
        description: "Run FF_gck_coin_data_availability.py"
        required: false
        default: "true"
      run_audit:
        description: "Run audit_10m_gaps.py"
        required: false
        default: "true"
      run_agg_drift:
        description: "Run audit_10m_aggregate_drift.py"
        required: false
        default: "true"
      continuity_rank_start:
        description: "Continuity backfill rank start"
        required: false
        default: "1"
      continuity_rank_end:
        description: "Continuity backfill rank end"
        required: false
        default: "1000"
      continuity_lookback_hours:
        description: "Continuity backfill lookback window in hours"
        required: false
        default: "72"
      precise_rank_end:
        description: "Precise API repair rank end"
        required: false
        default: "100"
      precise_repair_lookback_hours:
        description: "Precise API repair lookback window in hours"
        required: false
        default: "24"
      precise_replace_derived:
        description: "Replace bf_* derived slots during precise repair"
        required: false
        default: "true"
      VERBOSE_MODE:
        description: "Verbose (0/1)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: gecko-legacy-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  continuity:
    if: ${{ (github.event.inputs.run_continuity_backfill || 'true') == 'true' || (github.event.inputs.run_precise_repair || 'true') == 'true' || (github.event.inputs.run_live_refresh || 'true') == 'true' || (github.event.inputs.run_mcap_rebuild || 'true') == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      ASTRA_TARGET: ${{ vars.ASTRA_TARGET != '' && vars.ASTRA_TARGET || 'main' }}
      CONTINUITY_RANK_START: ${{ github.event.inputs.continuity_rank_start || '1' }}
      CONTINUITY_RANK_END: ${{ github.event.inputs.continuity_rank_end || '1000' }}
      CONTINUITY_LOOKBACK_HOURS: ${{ github.event.inputs.continuity_lookback_hours || '72' }}
      PRECISE_RANK_END: ${{ github.event.inputs.precise_rank_end || '100' }}
      PRECISE_REPAIR_LOOKBACK_HOURS: ${{ github.event.inputs.precise_repair_lookback_hours || '24' }}
      PRECISE_REPLACE_DERIVED: ${{ github.event.inputs.precise_replace_derived || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Prepare Astra env
        env:
          ASTRA_BUNDLE_BASE64_MAIN: ${{ secrets.ASTRA_BUNDLE_BASE64 }}
          ASTRA_BUNDLE_BASE64_BACKUP: ${{ secrets.ASTRA_BUNDLE_BASE64_BACKUP }}
          ASTRA_TOKEN_MAIN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_TOKEN_BACKUP: ${{ secrets.ASTRA_TOKEN_BACKUP }}
          ASTRA_KEYSPACE_MAIN: ${{ secrets.ASTRA_KEYSPACE }}
          ASTRA_KEYSPACE_BACKUP: ${{ secrets.ASTRA_KEYSPACE_BACKUP }}
        run: |
          set -euo pipefail
          MAIN_BUNDLE="secure-connect-main.zip"
          BACKUP_BUNDLE="secure-connect-backup.zip"

          echo "${ASTRA_BUNDLE_BASE64_MAIN}" | base64 -d > "${MAIN_BUNDLE}"
          test -s "${MAIN_BUNDLE}"

          if [ "${ASTRA_TARGET}" = "backup" ]; then
            if [ -z "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_BUNDLE_BASE64_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
            if [ -z "${ASTRA_TOKEN_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_TOKEN_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
          fi

          if [ -n "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
            echo "${ASTRA_BUNDLE_BASE64_BACKUP}" | base64 -d > "${BACKUP_BUNDLE}"
            test -s "${BACKUP_BUNDLE}"
          fi

          ACTIVE_BUNDLE="${MAIN_BUNDLE}"
          ACTIVE_TOKEN="${ASTRA_TOKEN_MAIN}"
          ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_MAIN}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            ACTIVE_BUNDLE="${BACKUP_BUNDLE}"
            ACTIVE_TOKEN="${ASTRA_TOKEN_BACKUP}"
            if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
              ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_BACKUP}"
            fi
          fi

          echo "ASTRA_BUNDLE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME=${ACTIVE_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME_BACKUP=${BACKUP_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_TOKEN=${ACTIVE_TOKEN}" >> "$GITHUB_ENV"
          echo "ASTRA_KEYSPACE=${ACTIVE_KEYSPACE}" >> "$GITHUB_ENV"

          if [ -n "${ASTRA_TOKEN_BACKUP:-}" ]; then
            echo "ASTRA_TOKEN_BACKUP=${ASTRA_TOKEN_BACKUP}" >> "$GITHUB_ENV"
          fi
          if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
            echo "ASTRA_KEYSPACE_BACKUP=${ASTRA_KEYSPACE_BACKUP}" >> "$GITHUB_ENV"
          fi

      - name: Log Astra target routing
        run: |
          echo "[astra-route] ASTRA_TARGET=${ASTRA_TARGET}"
          echo "[astra-route] ASTRA_KEYSPACE=${ASTRA_KEYSPACE:-unset}"
          echo "[astra-route] ASTRA_BUNDLE_NAME=${ASTRA_BUNDLE_NAME:-unset}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            echo "[astra-route] writing to BACKUP Astra DB"
          else
            echo "[astra-route] writing to MAIN Astra DB"
          fi

      - name: Continuity backfill (local only)
        if: ${{ (github.event.inputs.run_continuity_backfill || 'true') == 'true' }}
        timeout-minutes: 45
        run: |
          set -euo pipefail
          TO_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          FROM_UTC="$(date -u -d "${CONTINUITY_LOOKBACK_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)"
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id GF_gck_backfill_raw_flat \
            --rank-start "${CONTINUITY_RANK_START}" \
            --rank-end "${CONTINUITY_RANK_END}" \
            -- python prices/prod_pipeline/GF_gck_backfill_raw_flat.py \
              --rank-start "${CONTINUITY_RANK_START}" \
              --rank-end "${CONTINUITY_RANK_END}" \
              --from-utc "${FROM_UTC}" \
              --to-utc "${TO_UTC}"

      - name: Precise API repair (top ranks only)
        if: ${{ (github.event.inputs.run_precise_repair || 'true') == 'true' }}
        timeout-minutes: 60
        env:
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEYS: "${{ secrets.COINGECKO_API_KEY_AA }},${{ secrets.COINGECKO_API_KEY_BB }},${{ secrets.COINGECKO_API_KEY_CC }},${{ secrets.COINGECKO_API_KEY_DD }}"
          COINGECKO_ALLOW_GENERIC_KEY_FALLBACK: "0"
          REQUEST_TIMEOUT_SEC: "45"
          FETCH_SIZE: "500"
          CG_CHUNK_HOURS: "72"
          PRECISE_RANK_END: ${{ github.event.inputs.precise_rank_end || '100' }}
          AUTHORITATIVE_10M_MAX_HOURS: ${{ github.event.inputs.precise_repair_lookback_hours || '24' }}
        run: |
          set -euo pipefail
          TO_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          FROM_UTC="$(date -u -d "${PRECISE_REPAIR_LOOKBACK_HOURS} hours ago" +%Y-%m-%dT%H:%M:%SZ)"

          CMD=(python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id GM_gck_manual_repair_intraday \
            --rank-start "1" \
            --rank-end "${PRECISE_RANK_END}" \
            -- python prices/prod_pipeline/GM_gck_manual_repair_intraday.py \
            --rank-start "1" \
            --rank-end "${PRECISE_RANK_END}" \
            --from-utc "${FROM_UTC}" \
            --to-utc "${TO_UTC}" \
            --granularity "both" \
            --precise-rank-end "${PRECISE_RANK_END}")

          if [ "${PRECISE_REPLACE_DERIVED}" = "true" ]; then
            CMD+=(--replace-derived)
          fi

          "${CMD[@]}"

      - name: Refresh live tables from raw continuity
        if: ${{ (github.event.inputs.run_live_refresh || 'true') == 'true' }}
        timeout-minutes: 40
        env:
          LIVE_REFRESH_RAW_LOOKBACK_HOURS: ${{ github.event.inputs.continuity_lookback_hours || '72' }}
          LIVE_REFRESH_DAILY_LOOKBACK_DAYS: "30"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id GI_gck_refresh_live_from_raw \
            --rank-start "${CONTINUITY_RANK_START}" \
            --rank-end "${CONTINUITY_RANK_END}" \
            -- python prices/prod_pipeline/GI_gck_refresh_live_from_raw.py \
              --rank-start "${CONTINUITY_RANK_START}" \
              --rank-end "${CONTINUITY_RANK_END}"

      - name: Rebuild market-cap aggregates from raw
        if: ${{ (github.event.inputs.run_mcap_rebuild || 'true') == 'true' }}
        timeout-minutes: 45
        env:
          TRUNCATE_TARGETS: "1"
          AGG_MIN_COINS: "700"
          REQUEST_TIMEOUT_SEC: "60"
          BATCH_FLUSH_EVERY: "50"
          COIN_WORKERS: "6"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id HH_recalculate_mcaps \
            --rank-start "${CONTINUITY_RANK_START}" \
            --rank-end "${CONTINUITY_RANK_END}" \
            -- python prices/HH_recalculate_mcaps.py

  availability:
    needs: continuity
    if: ${{ always() && (needs.continuity.result == 'success' || needs.continuity.result == 'skipped') && (github.event.inputs.run_availability || 'true') == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        avail_shard_index: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      ASTRA_TARGET: ${{ vars.ASTRA_TARGET != '' && vars.ASTRA_TARGET || 'main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Prepare Astra env
        env:
          ASTRA_BUNDLE_BASE64_MAIN: ${{ secrets.ASTRA_BUNDLE_BASE64 }}
          ASTRA_BUNDLE_BASE64_BACKUP: ${{ secrets.ASTRA_BUNDLE_BASE64_BACKUP }}
          ASTRA_TOKEN_MAIN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_TOKEN_BACKUP: ${{ secrets.ASTRA_TOKEN_BACKUP }}
          ASTRA_KEYSPACE_MAIN: ${{ secrets.ASTRA_KEYSPACE }}
          ASTRA_KEYSPACE_BACKUP: ${{ secrets.ASTRA_KEYSPACE_BACKUP }}
        run: |
          set -euo pipefail
          MAIN_BUNDLE="secure-connect-main.zip"
          BACKUP_BUNDLE="secure-connect-backup.zip"

          echo "${ASTRA_BUNDLE_BASE64_MAIN}" | base64 -d > "${MAIN_BUNDLE}"
          test -s "${MAIN_BUNDLE}"

          if [ "${ASTRA_TARGET}" = "backup" ]; then
            if [ -z "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_BUNDLE_BASE64_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
            if [ -z "${ASTRA_TOKEN_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_TOKEN_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
          fi

          if [ -n "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
            echo "${ASTRA_BUNDLE_BASE64_BACKUP}" | base64 -d > "${BACKUP_BUNDLE}"
            test -s "${BACKUP_BUNDLE}"
          fi

          ACTIVE_BUNDLE="${MAIN_BUNDLE}"
          ACTIVE_TOKEN="${ASTRA_TOKEN_MAIN}"
          ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_MAIN}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            ACTIVE_BUNDLE="${BACKUP_BUNDLE}"
            ACTIVE_TOKEN="${ASTRA_TOKEN_BACKUP}"
            if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
              ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_BACKUP}"
            fi
          fi

          echo "ASTRA_BUNDLE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME=${ACTIVE_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME_BACKUP=${BACKUP_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_TOKEN=${ACTIVE_TOKEN}" >> "$GITHUB_ENV"
          echo "ASTRA_KEYSPACE=${ACTIVE_KEYSPACE}" >> "$GITHUB_ENV"

          if [ -n "${ASTRA_TOKEN_BACKUP:-}" ]; then
            echo "ASTRA_TOKEN_BACKUP=${ASTRA_TOKEN_BACKUP}" >> "$GITHUB_ENV"
          fi
          if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
            echo "ASTRA_KEYSPACE_BACKUP=${ASTRA_KEYSPACE_BACKUP}" >> "$GITHUB_ENV"
          fi

      - name: Log Astra target routing
        run: |
          echo "[astra-route] ASTRA_TARGET=${ASTRA_TARGET}"
          echo "[astra-route] ASTRA_KEYSPACE=${ASTRA_KEYSPACE:-unset}"
          echo "[astra-route] ASTRA_BUNDLE_NAME=${ASTRA_BUNDLE_NAME:-unset}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            echo "[astra-route] writing to BACKUP Astra DB"
          else
            echo "[astra-route] writing to MAIN Astra DB"
          fi

      - name: Availability refresh (daily + intraday)
        timeout-minutes: 24
        env:
          REQUEST_TIMEOUT_SEC: "30"
          LOG_HEARTBEAT_SEC: "20"
          AVAIL_RUN_DAILY: "1"
          AVAIL_RUN_INTRADAY: "1"
          IDS_SOURCE: "live"
          AVAIL_TOP_N: "1000"
          AVAIL_SHARD_COUNT: "2"
          AVAIL_SHARD_INDEX: ${{ matrix.avail_shard_index }}
          WIN_10M_DAYS: "7"
          WIN_HOURLY_DAYS: "30"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id FF_gck_coin_data_availability \
            --scope availability-shard-${{ matrix.avail_shard_index }}-of-2 \
            -- python prices/prod_pipeline/FF_gck_coin_data_availability.py

  audits:
    needs: continuity
    if: ${{ always() && (needs.continuity.result == 'success' || needs.continuity.result == 'skipped') && ((github.event.inputs.run_audit || 'true') == 'true' || (github.event.inputs.run_agg_drift || 'true') == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      ASTRA_TARGET: ${{ vars.ASTRA_TARGET != '' && vars.ASTRA_TARGET || 'main' }}
      RUN_AUDIT: ${{ github.event.inputs.run_audit || 'true' }}
      RUN_AGG_DRIFT: ${{ github.event.inputs.run_agg_drift || 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Prepare Astra env
        env:
          ASTRA_BUNDLE_BASE64_MAIN: ${{ secrets.ASTRA_BUNDLE_BASE64 }}
          ASTRA_BUNDLE_BASE64_BACKUP: ${{ secrets.ASTRA_BUNDLE_BASE64_BACKUP }}
          ASTRA_TOKEN_MAIN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_TOKEN_BACKUP: ${{ secrets.ASTRA_TOKEN_BACKUP }}
          ASTRA_KEYSPACE_MAIN: ${{ secrets.ASTRA_KEYSPACE }}
          ASTRA_KEYSPACE_BACKUP: ${{ secrets.ASTRA_KEYSPACE_BACKUP }}
        run: |
          set -euo pipefail
          MAIN_BUNDLE="secure-connect-main.zip"
          BACKUP_BUNDLE="secure-connect-backup.zip"

          echo "${ASTRA_BUNDLE_BASE64_MAIN}" | base64 -d > "${MAIN_BUNDLE}"
          test -s "${MAIN_BUNDLE}"

          if [ "${ASTRA_TARGET}" = "backup" ]; then
            if [ -z "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_BUNDLE_BASE64_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
            if [ -z "${ASTRA_TOKEN_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_TOKEN_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
          fi

          if [ -n "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
            echo "${ASTRA_BUNDLE_BASE64_BACKUP}" | base64 -d > "${BACKUP_BUNDLE}"
            test -s "${BACKUP_BUNDLE}"
          fi

          ACTIVE_BUNDLE="${MAIN_BUNDLE}"
          ACTIVE_TOKEN="${ASTRA_TOKEN_MAIN}"
          ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_MAIN}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            ACTIVE_BUNDLE="${BACKUP_BUNDLE}"
            ACTIVE_TOKEN="${ASTRA_TOKEN_BACKUP}"
            if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
              ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_BACKUP}"
            fi
          fi

          echo "ASTRA_BUNDLE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME=${ACTIVE_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME_BACKUP=${BACKUP_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_TOKEN=${ACTIVE_TOKEN}" >> "$GITHUB_ENV"
          echo "ASTRA_KEYSPACE=${ACTIVE_KEYSPACE}" >> "$GITHUB_ENV"

          if [ -n "${ASTRA_TOKEN_BACKUP:-}" ]; then
            echo "ASTRA_TOKEN_BACKUP=${ASTRA_TOKEN_BACKUP}" >> "$GITHUB_ENV"
          fi
          if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
            echo "ASTRA_KEYSPACE_BACKUP=${ASTRA_KEYSPACE_BACKUP}" >> "$GITHUB_ENV"
          fi

      - name: Log Astra target routing
        run: |
          echo "[astra-route] ASTRA_TARGET=${ASTRA_TARGET}"
          echo "[astra-route] ASTRA_KEYSPACE=${ASTRA_KEYSPACE:-unset}"
          echo "[astra-route] ASTRA_BUNDLE_NAME=${ASTRA_BUNDLE_NAME:-unset}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            echo "[astra-route] writing to BACKUP Astra DB"
          else
            echo "[astra-route] writing to MAIN Astra DB"
          fi

      - name: 10m gap audit (top 1000)
        if: env.RUN_AUDIT == 'true'
        timeout-minutes: 8
        env:
          TOP_N_DQ: "1000"
          DQ_WINDOW_10M_DAYS: "7"
          DQ_REQUEST_TIMEOUT_SEC: "30"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id audit_10m_gaps \
            -- python prices/prod_pipeline/audit_10m_gaps.py

      - name: 10m aggregate drift audit
        if: env.RUN_AGG_DRIFT == 'true'
        timeout-minutes: 12
        env:
          TOP_N_DQ: "1000"
          DRIFT_LOOKBACK_HOURS: "36"
          DRIFT_REL_THRESHOLD_PCT: "0.03"
          DRIFT_ABS_THRESHOLD_USD: "50000000000"
          DRIFT_MIN_COINS: "700"
          DRIFT_AUTO_REPAIR: "1"
          DRIFT_MAX_REPAIRS: "6"
          DRIFT_FAIL_ON_FINDING: "1"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id audit_10m_aggregate_drift \
            -- python prices/prod_pipeline/audit_10m_aggregate_drift.py
