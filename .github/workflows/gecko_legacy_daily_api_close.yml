name: gecko-legacy-daily-api-close

on:
  workflow_dispatch:
    inputs:
      run_daily_api_close:
        description: "Run EF_gck_close_daily_topn_api.py"
        required: false
        default: "true"
      TOP_N_API_DAILY:
        description: "Top N for true API daily close"
        required: false
        default: "300"
      rank_start:
        description: "Optional inclusive rank start (overrides TOP_N scope model)"
        required: false
        default: ""
      rank_end:
        description: "Optional inclusive rank end (defaults to TOP_N_API_DAILY when blank)"
        required: false
        default: ""
      coin_ids:
        description: "Optional comma-separated CoinGecko IDs (intersected with rank window)"
        required: false
        default: ""
      TOP_N_AGG_DAILY:
        description: "Top N used to rebuild daily mcap aggregates"
        required: false
        default: "1000"
      TARGET_START_DAY_ISO:
        description: "Optional start day YYYY-MM-DD (inclusive)"
        required: false
        default: ""
      TARGET_END_DAY_ISO:
        description: "Optional end day YYYY-MM-DD (inclusive)"
        required: false
        default: ""
      TARGET_DAY_ISO:
        description: "Legacy single-day input (fallback only)"
        required: false
        default: ""
      VERBOSE_MODE:
        description: "Verbose (0/1)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: gecko-legacy-daily-api-close-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.event.inputs.run_daily_api_close != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      ASTRA_TARGET: ${{ vars.ASTRA_TARGET != '' && vars.ASTRA_TARGET || 'main' }}
      VERBOSE_RESOLVED: ${{ github.event.inputs.VERBOSE_MODE || '0' }}
      RANK_START_RESOLVED: ${{ github.event.inputs.rank_start || '1' }}
      RANK_END_RESOLVED: ${{ github.event.inputs.rank_end || github.event.inputs.TOP_N_API_DAILY || '300' }}
      COIN_IDS_RESOLVED: ${{ github.event.inputs.coin_ids || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Prepare Astra env
        env:
          ASTRA_BUNDLE_BASE64_MAIN: ${{ secrets.ASTRA_BUNDLE_BASE64 }}
          ASTRA_BUNDLE_BASE64_BACKUP: ${{ secrets.ASTRA_BUNDLE_BASE64_BACKUP }}
          ASTRA_TOKEN_MAIN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_TOKEN_BACKUP: ${{ secrets.ASTRA_TOKEN_BACKUP }}
          ASTRA_KEYSPACE_MAIN: ${{ secrets.ASTRA_KEYSPACE }}
          ASTRA_KEYSPACE_BACKUP: ${{ secrets.ASTRA_KEYSPACE_BACKUP }}
        run: |
          set -euo pipefail
          MAIN_BUNDLE="secure-connect-main.zip"
          BACKUP_BUNDLE="secure-connect-backup.zip"

          echo "${ASTRA_BUNDLE_BASE64_MAIN}" | base64 -d > "${MAIN_BUNDLE}"
          test -s "${MAIN_BUNDLE}"

          if [ "${ASTRA_TARGET}" = "backup" ]; then
            if [ -z "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_BUNDLE_BASE64_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
            if [ -z "${ASTRA_TOKEN_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_TOKEN_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
          fi

          if [ -n "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
            echo "${ASTRA_BUNDLE_BASE64_BACKUP}" | base64 -d > "${BACKUP_BUNDLE}"
            test -s "${BACKUP_BUNDLE}"
          fi

          ACTIVE_BUNDLE="${MAIN_BUNDLE}"
          ACTIVE_TOKEN="${ASTRA_TOKEN_MAIN}"
          ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_MAIN}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            ACTIVE_BUNDLE="${BACKUP_BUNDLE}"
            ACTIVE_TOKEN="${ASTRA_TOKEN_BACKUP}"
            if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
              ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_BACKUP}"
            fi
          fi

          echo "ASTRA_BUNDLE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME=${ACTIVE_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME_BACKUP=${BACKUP_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_TOKEN=${ACTIVE_TOKEN}" >> "$GITHUB_ENV"
          echo "ASTRA_KEYSPACE=${ACTIVE_KEYSPACE}" >> "$GITHUB_ENV"

          if [ -n "${ASTRA_TOKEN_BACKUP:-}" ]; then
            echo "ASTRA_TOKEN_BACKUP=${ASTRA_TOKEN_BACKUP}" >> "$GITHUB_ENV"
          fi
          if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
            echo "ASTRA_KEYSPACE_BACKUP=${ASTRA_KEYSPACE_BACKUP}" >> "$GITHUB_ENV"
          fi

      - name: API daily close
        env:
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEYS: "${{ secrets.COINGECKO_API_KEY_AA }},${{ secrets.COINGECKO_API_KEY_BB }},${{ secrets.COINGECKO_API_KEY_CC }},${{ secrets.COINGECKO_API_KEY_DD }}"
          COINGECKO_ALLOW_GENERIC_KEY_FALLBACK: "0"
          TOP_N_API_DAILY: ${{ github.event.inputs.TOP_N_API_DAILY || '300' }}
          TOP_N_AGG_DAILY: ${{ github.event.inputs.TOP_N_AGG_DAILY || '1000' }}
          RANK_START: ${{ env.RANK_START_RESOLVED }}
          RANK_END: ${{ env.RANK_END_RESOLVED }}
          COIN_IDS: ${{ env.COIN_IDS_RESOLVED }}
          TARGET_START_DAY_ISO: ${{ github.event.inputs.TARGET_START_DAY_ISO || '' }}
          TARGET_END_DAY_ISO: ${{ github.event.inputs.TARGET_END_DAY_ISO || '' }}
          TARGET_DAY_ISO: ${{ github.event.inputs.TARGET_DAY_ISO || '' }}
          REBUILD_MCAP_DAILY: "1"
          REQUEST_TIMEOUT_SEC: "45"
          CG_BACKOFF_BASE_S: "3"
          VERBOSE_MODE: ${{ env.VERBOSE_RESOLVED }}
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id EF_gck_close_daily_topn_api \
            --rank-start "${{ env.RANK_START_RESOLVED }}" \
            --rank-end "${{ env.RANK_END_RESOLVED }}" \
            -- python prices/prod_pipeline/EF_gck_close_daily_topn_api.py
