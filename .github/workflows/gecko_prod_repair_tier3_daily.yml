name: gecko-prod-repair-tier3-daily
# scheduler-touch: 2026-02-14

on:
  workflow_dispatch:
    inputs:
      run_repair:
        description: "Run 92_repair_timeseries.py"
        required: false
        default: "true"
      run_availability:
        description: "Run 91_update_coin_data_availability.py"
        required: false
        default: "true"
      run_audit:
        description: "Run 90_audit_10m_gaps.py"
        required: false
        default: "true"
      VERBOSE_MODE:
        description: "Verbose (0/1)"
        required: false
        default: "0"
  schedule:
    - cron: "55 2 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: gecko-prod-repair-tier3-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'schedule' || vars.ENABLE_GH_FALLBACK_SCHEDULE == '1' }}
    timeout-minutes: 35
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONWARNINGS: default
      RUN_REPAIR: ${{ (github.event_name == 'schedule' && 'true') || (github.event.inputs.run_repair || 'true') }}
      RUN_AVAIL: ${{ (github.event_name == 'schedule' && 'true') || (github.event.inputs.run_availability || 'true') }}
      RUN_AUDIT: ${{ (github.event_name == 'schedule' && 'true') || (github.event.inputs.run_audit || 'true') }}
      VERBOSE_RESOLVED: ${{ github.event.inputs.VERBOSE_MODE || '0' }}
      PP_RANK_START: "601"
      PP_RANK_END: "1000"
      PP_TEST_MODE_UNTIL_UTC: ""
      PP_FORCE_TEST_MODE: "0"
      PP_TEST_COIN_IDS: "bitcoin,ethereum"
      PP_TABLE_LIVE: "gecko_prices_live"
      PP_TABLE_LIVE_RANKED: "gecko_prices_live_ranked"
      PP_TABLE_ROLLING: "gecko_prices_live_rolling"
      PP_TABLE_10M: "gecko_prices_10m_7d"
      PP_TABLE_HOURLY: "gecko_candles_hourly_30d"
      PP_TABLE_DAILY: "gecko_candles_daily_contin"
      PP_TABLE_MONTHLY: "gecko_candles_monthly"
      PP_TABLE_MCAP_LIVE: "gecko_market_cap_live"
      PP_TABLE_MCAP_10M: "gecko_market_cap_10m_7d"
      PP_TABLE_MCAP_HOURLY: "gecko_market_cap_hourly_30d"
      PP_TABLE_MCAP_DAILY: "gecko_market_cap_daily_contin"
      PP_TABLE_DAILY_RANGES: "coin_daily_coverage_ranges"
      PP_TABLE_DAILY_AVAIL: "coin_daily_availability"
      PP_TABLE_INTRADAY_COV: "coin_intraday_coverage"
      PP_TABLE_JOB_LOCKS: "job_locks"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Astra bundle
        run: |
          echo "${{ secrets.ASTRA_BUNDLE_BASE64 }}" | base64 -d > secure-connect.zip
          test -s secure-connect.zip

      - name: Tier3 repair (rank 601-1000)
        if: env.RUN_REPAIR == 'true'
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEY_AA: ${{ secrets.COINGECKO_API_KEY_AA != '' && secrets.COINGECKO_API_KEY_AA || secrets.COINGECKO_API_KEY }}
          COINGECKO_API_KEY_BB: ${{ secrets.COINGECKO_API_KEY_BB != '' && secrets.COINGECKO_API_KEY_BB || secrets.COINGECKO_API_KEY }}
          COINGECKO_API_KEY_CC: ${{ secrets.COINGECKO_API_KEY_CC != '' && secrets.COINGECKO_API_KEY_CC || secrets.COINGECKO_API_KEY }}
          VERBOSE_MODE: ${{ env.VERBOSE_RESOLVED }}
          PP_REPAIR_10M_HOURS: "24"
          PP_REPAIR_INTERPOLATE: "1"
          PP_REPAIR_REWRITE_NON_API: "1"
          PP_REPAIR_LOCK_ENABLED: "1"
          PP_REPAIR_LOCK_JOB: "pp_repair_tier3"
          PP_REPAIR_LOCK_BUCKET_HOURS: "24"
          PP_REPAIR_LOCK_TTL_SEC: "87000"
          PP_REPAIR_RUN_HOURLY: "0"
          PP_REPAIR_RUN_DAILY: "1"
          PP_REPAIR_RUN_MONTHLY: "0"
          PP_REPAIR_RUN_MCAP: "0"
          REQUEST_TIMEOUT_SEC: "45"
        run: python prices/prod_pipeline/92_repair_timeseries.py

      - name: Tier3 availability update
        if: env.RUN_AVAIL == 'true'
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          PP_AVAIL_DAILY_WINDOW_DAYS: "365"
          PP_AVAIL_10M_DAYS: "7"
          PP_AVAIL_HOURLY_DAYS: "30"
          REQUEST_TIMEOUT_SEC: "45"
        run: python prices/prod_pipeline/91_update_coin_data_availability.py

      - name: Tier3 10m gap audit
        if: env.RUN_AUDIT == 'true'
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          PP_AUDIT_WINDOW_DAYS: "7"
          PP_AUDIT_ONLY_WITH_GAPS: "1"
          REQUEST_TIMEOUT_SEC: "45"
        run: python prices/prod_pipeline/90_audit_10m_gaps.py

