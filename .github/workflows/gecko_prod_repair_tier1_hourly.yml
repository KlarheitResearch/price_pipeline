name: gecko-prod-repair-tier1-hourly
# scheduler-touch: 2026-02-14

on:
  workflow_dispatch:
    inputs:
      run_repair:
        description: "Run 92_repair_timeseries.py"
        required: false
        default: "true"
      VERBOSE_MODE:
        description: "Verbose (0/1)"
        required: false
        default: "0"
  schedule:
    - cron: "37 * * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: gecko-prod-repair-tier1-hourly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONWARNINGS: default
      RUN_REPAIR: ${{ (github.event_name == 'schedule' && 'true') || (github.event.inputs.run_repair || 'true') }}
      VERBOSE_RESOLVED: ${{ github.event.inputs.VERBOSE_MODE || '0' }}
      PP_RANK_START: "1"
      PP_RANK_END: "200"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Astra bundle
        run: |
          echo "${{ secrets.ASTRA_BUNDLE_BASE64 }}" | base64 -d > secure-connect.zip
          test -s secure-connect.zip

      - name: Tier1 repair (rank 1-200)
        if: env.RUN_REPAIR == 'true'
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEY_AA: ${{ secrets.COINGECKO_API_KEY_AA != '' && secrets.COINGECKO_API_KEY_AA || secrets.COINGECKO_API_KEY }}
          COINGECKO_API_KEY_BB: ${{ secrets.COINGECKO_API_KEY_BB != '' && secrets.COINGECKO_API_KEY_BB || secrets.COINGECKO_API_KEY }}
          VERBOSE_MODE: ${{ env.VERBOSE_RESOLVED }}
          PP_REPAIR_10M_HOURS: "6"
          PP_REPAIR_INTERPOLATE: "1"
          PP_REPAIR_LOCK_ENABLED: "1"
          PP_REPAIR_LOCK_JOB: "pp_repair_tier1"
          PP_REPAIR_LOCK_BUCKET_HOURS: "1"
          PP_REPAIR_LOCK_TTL_SEC: "4500"
          PP_REPAIR_RUN_HOURLY: "1"
          PP_REPAIR_RUN_DAILY: "1"
          PP_REPAIR_RUN_MONTHLY: "0"
          PP_REPAIR_RUN_MCAP: "0"
          REQUEST_TIMEOUT_SEC: "45"
        run: python prices/prod_pipeline/92_repair_timeseries.py
