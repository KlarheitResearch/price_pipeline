name: gecko-prod-tier3-4h
# scheduler-touch: 2026-02-14

on:
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run AA_load_live_selected.py"
        required: false
        default: "true"
      run_10m:
        description: "Run CC_build_10m_intraday.py"
        required: false
        default: "true"
      run_derivatives:
        description: "Run BB_refresh_live_derivatives.py"
        required: false
        default: "true"
      run_hourly:
        description: "Run DD_build_hourly_and_finalize.py"
        required: false
        default: "true"
      run_daily:
        description: "Run EE_build_daily_and_finalize.py"
        required: false
        default: "true"
      run_monthly:
        description: "Run EG_build_monthly_from_daily.py"
        required: false
        default: "true"
      VERBOSE_MODE:
        description: "Verbose (0/1)"
        required: false
        default: "0"
  schedule:
    - cron: "11 */4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: gecko-prod-tier3-4h-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONWARNINGS: default
      RUN_LIVE: ${{ (github.event_name == 'schedule' && 'true') || (github.event.inputs.run_live || 'true') }}
      RUN_10M: ${{ (github.event_name == 'schedule' && 'true') || (github.event.inputs.run_10m || 'true') }}
      RUN_DERIV: ${{ (github.event_name == 'schedule' && 'true') || (github.event.inputs.run_derivatives || 'true') }}
      RUN_HOURLY: ${{ (github.event_name == 'schedule' && 'true') || (github.event.inputs.run_hourly || 'true') }}
      RUN_DAILY: ${{ (github.event_name == 'schedule' && 'true') || (github.event.inputs.run_daily || 'true') }}
      RUN_MONTHLY: ${{ (github.event_name == 'schedule' && 'true') || (github.event.inputs.run_monthly || 'true') }}
      VERBOSE_RESOLVED: ${{ github.event.inputs.VERBOSE_MODE || '0' }}
      PP_RANK_START: "601"
      PP_RANK_END: "1000"
      PP_SLOTS_BACKFILL: "24"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Astra bundle
        run: |
          echo "${{ secrets.ASTRA_BUNDLE_BASE64 }}" | base64 -d > secure-connect.zip
          test -s secure-connect.zip

      - name: Tier3 live snapshot (rank 601-1000)
        if: env.RUN_LIVE == 'true'
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEY_AA: ${{ secrets.COINGECKO_API_KEY_AA != '' && secrets.COINGECKO_API_KEY_AA || secrets.COINGECKO_API_KEY }}
          COINGECKO_API_KEY_BB: ${{ secrets.COINGECKO_API_KEY_BB != '' && secrets.COINGECKO_API_KEY_BB || secrets.COINGECKO_API_KEY }}
          VERBOSE_MODE: ${{ env.VERBOSE_RESOLVED }}
        run: python prices/prod_pipeline/AA_load_live_selected.py

      - name: Refresh live ranked + live mcap (top 1000)
        if: env.RUN_DERIV == 'true'
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          PP_TOP_N: "1000"
          PP_RANK_BUCKET: "all"
          REQUEST_TIMEOUT_SEC: "45"
        run: python prices/prod_pipeline/BB_refresh_live_derivatives.py

      - name: Tier3 build 10m (rank 601-1000)
        if: env.RUN_10M == 'true'
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEY_AA: ${{ secrets.COINGECKO_API_KEY_AA != '' && secrets.COINGECKO_API_KEY_AA || secrets.COINGECKO_API_KEY }}
          COINGECKO_API_KEY_BB: ${{ secrets.COINGECKO_API_KEY_BB != '' && secrets.COINGECKO_API_KEY_BB || secrets.COINGECKO_API_KEY }}
          VERBOSE_MODE: ${{ env.VERBOSE_RESOLVED }}
          PP_SLOT_DELAY_SEC: "90"
          REQUEST_TIMEOUT_SEC: "45"
        run: python prices/prod_pipeline/CC_build_10m_intraday.py

      - name: Tier3 update hourly candles (rank 601-1000)
        if: env.RUN_HOURLY == 'true'
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEY_AA: ${{ secrets.COINGECKO_API_KEY_AA != '' && secrets.COINGECKO_API_KEY_AA || secrets.COINGECKO_API_KEY }}
          COINGECKO_API_KEY_BB: ${{ secrets.COINGECKO_API_KEY_BB != '' && secrets.COINGECKO_API_KEY_BB || secrets.COINGECKO_API_KEY }}
          PP_SLOT_DELAY_SEC: "90"
          PP_HOURLY_FINALIZE_LOOKBACK: "6"
          REQUEST_TIMEOUT_SEC: "45"
        run: python prices/prod_pipeline/DD_build_hourly_and_finalize.py

      - name: Tier3 update daily candles (rank 601-1000)
        if: env.RUN_DAILY == 'true'
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEY_AA: ${{ secrets.COINGECKO_API_KEY_AA != '' && secrets.COINGECKO_API_KEY_AA || secrets.COINGECKO_API_KEY }}
          COINGECKO_API_KEY_BB: ${{ secrets.COINGECKO_API_KEY_BB != '' && secrets.COINGECKO_API_KEY_BB || secrets.COINGECKO_API_KEY }}
          PP_SLOT_DELAY_SEC: "90"
          PP_DAILY_FINALIZE_LOOKBACK_DAYS: "2"
          REQUEST_TIMEOUT_SEC: "45"
        run: python prices/prod_pipeline/EE_build_daily_and_finalize.py

      - name: Tier3 update monthly candles (rank 601-1000)
        if: env.RUN_MONTHLY == 'true'
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          PP_MONTHLY_FINALIZE_LOOKBACK: "2"
          REQUEST_TIMEOUT_SEC: "45"
        run: python prices/prod_pipeline/EG_build_monthly_from_daily.py
