name: gecko-legacy-anchor-heal

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force_heal:
        description: "Force API heal even if stale checks are clean"
        required: false
        default: "false"
      anchor_ids:
        description: "Comma-separated CoinGecko IDs"
        required: false
        default: "bitcoin,ethereum,solana"
      lookback_hours:
        description: "Repair window lookback hours"
        required: false
        default: "18"
      stale_10m_minutes:
        description: "Mark stale if latest 10m is older than this"
        required: false
        default: "45"
      stale_hourly_minutes:
        description: "Mark stale if latest hourly is older than this"
        required: false
        default: "180"
      coverage_hours:
        description: "Coverage check lookback hours"
        required: false
        default: "6"
      max_missing_10m_slots:
        description: "Heal if missing slots in coverage window exceed this"
        required: false
        default: "2"
      rank_start:
        description: "Inclusive start rank for repair script"
        required: false
        default: "1"
      rank_end:
        description: "Inclusive end rank for repair script"
        required: false
        default: "1000"
      granularity:
        description: "Repair granularity"
        type: choice
        required: false
        default: both
        options:
          - 10m
          - hourly
          - both
      overwrite_existing:
        description: "Overwrite rows that already exist"
        type: choice
        required: false
        default: "true"
        options:
          - "false"
          - "true"
      dry_run:
        description: "Compute only (no writes)"
        type: choice
        required: false
        default: "false"
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: gecko-legacy-anchor-heal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONWARNINGS: default
      ASTRA_TARGET: ${{ vars.ASTRA_TARGET != '' && vars.ASTRA_TARGET || 'main' }}

      HEAL_FORCE_RESOLVED: ${{ github.event.inputs.force_heal || 'false' }}
      HEAL_ANCHOR_IDS_RESOLVED: ${{ github.event.inputs.anchor_ids || 'bitcoin,ethereum,solana' }}
      HEAL_LOOKBACK_HOURS_RESOLVED: ${{ github.event.inputs.lookback_hours || '18' }}
      HEAL_STALE_10M_MINUTES_RESOLVED: ${{ github.event.inputs.stale_10m_minutes || '45' }}
      HEAL_STALE_HOURLY_MINUTES_RESOLVED: ${{ github.event.inputs.stale_hourly_minutes || '180' }}
      HEAL_COVERAGE_HOURS_RESOLVED: ${{ github.event.inputs.coverage_hours || '6' }}
      HEAL_MAX_MISSING_10M_SLOTS_RESOLVED: ${{ github.event.inputs.max_missing_10m_slots || '2' }}
      HEAL_RANK_START_RESOLVED: ${{ github.event.inputs.rank_start || '1' }}
      HEAL_RANK_END_RESOLVED: ${{ github.event.inputs.rank_end || '1000' }}
      HEAL_GRANULARITY_RESOLVED: ${{ github.event.inputs.granularity || 'both' }}
      HEAL_OVERWRITE_EXISTING_RESOLVED: ${{ github.event.inputs.overwrite_existing || 'true' }}
      HEAL_DRY_RUN_RESOLVED: ${{ github.event.inputs.dry_run || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Prepare Astra env
        env:
          ASTRA_BUNDLE_BASE64_MAIN: ${{ secrets.ASTRA_BUNDLE_BASE64 }}
          ASTRA_BUNDLE_BASE64_BACKUP: ${{ secrets.ASTRA_BUNDLE_BASE64_BACKUP }}
          ASTRA_TOKEN_MAIN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_TOKEN_BACKUP: ${{ secrets.ASTRA_TOKEN_BACKUP }}
          ASTRA_KEYSPACE_MAIN: ${{ secrets.ASTRA_KEYSPACE }}
          ASTRA_KEYSPACE_BACKUP: ${{ secrets.ASTRA_KEYSPACE_BACKUP }}
        run: |
          set -euo pipefail
          MAIN_BUNDLE="secure-connect-main.zip"
          BACKUP_BUNDLE="secure-connect-backup.zip"

          echo "${ASTRA_BUNDLE_BASE64_MAIN}" | base64 -d > "${MAIN_BUNDLE}"
          test -s "${MAIN_BUNDLE}"

          if [ "${ASTRA_TARGET}" = "backup" ]; then
            if [ -z "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_BUNDLE_BASE64_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
            if [ -z "${ASTRA_TOKEN_BACKUP:-}" ]; then
              echo "Missing secret ASTRA_TOKEN_BACKUP while ASTRA_TARGET=backup" >&2
              exit 1
            fi
          fi

          if [ -n "${ASTRA_BUNDLE_BASE64_BACKUP:-}" ]; then
            echo "${ASTRA_BUNDLE_BASE64_BACKUP}" | base64 -d > "${BACKUP_BUNDLE}"
            test -s "${BACKUP_BUNDLE}"
          fi

          ACTIVE_BUNDLE="${MAIN_BUNDLE}"
          ACTIVE_TOKEN="${ASTRA_TOKEN_MAIN}"
          ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_MAIN}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            ACTIVE_BUNDLE="${BACKUP_BUNDLE}"
            ACTIVE_TOKEN="${ASTRA_TOKEN_BACKUP}"
            if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
              ACTIVE_KEYSPACE="${ASTRA_KEYSPACE_BACKUP}"
            fi
          fi

          echo "ASTRA_BUNDLE_PATH=$PWD" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME=${ACTIVE_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_BUNDLE_NAME_BACKUP=${BACKUP_BUNDLE}" >> "$GITHUB_ENV"
          echo "ASTRA_TOKEN=${ACTIVE_TOKEN}" >> "$GITHUB_ENV"
          echo "ASTRA_KEYSPACE=${ACTIVE_KEYSPACE}" >> "$GITHUB_ENV"

          if [ -n "${ASTRA_TOKEN_BACKUP:-}" ]; then
            echo "ASTRA_TOKEN_BACKUP=${ASTRA_TOKEN_BACKUP}" >> "$GITHUB_ENV"
          fi
          if [ -n "${ASTRA_KEYSPACE_BACKUP:-}" ]; then
            echo "ASTRA_KEYSPACE_BACKUP=${ASTRA_KEYSPACE_BACKUP}" >> "$GITHUB_ENV"
          fi

      - name: Log Astra target routing
        run: |
          echo "[astra-route] ASTRA_TARGET=${ASTRA_TARGET}"
          echo "[astra-route] ASTRA_KEYSPACE=${ASTRA_KEYSPACE:-unset}"
          echo "[astra-route] ASTRA_BUNDLE_NAME=${ASTRA_BUNDLE_NAME:-unset}"
          if [ "${ASTRA_TARGET}" = "backup" ]; then
            echo "[astra-route] writing to BACKUP Astra DB"
          else
            echo "[astra-route] writing to MAIN Astra DB"
          fi

      - name: Heal anchor assets if stale
        env:
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEYS: "${{ secrets.COINGECKO_API_KEY_AA }},${{ secrets.COINGECKO_API_KEY_BB }},${{ secrets.COINGECKO_API_KEY_CC }},${{ secrets.COINGECKO_API_KEY_DD }}"
          COINGECKO_ALLOW_GENERIC_KEY_FALLBACK: "0"
          REQUEST_TIMEOUT_SEC: "45"
          CONNECT_TIMEOUT_SEC: "15"
          FETCH_SIZE: "500"
          CG_CHUNK_HOURS: "72"

          HEAL_FORCE: "${{ env.HEAL_FORCE_RESOLVED }}"
          HEAL_ANCHOR_IDS: "${{ env.HEAL_ANCHOR_IDS_RESOLVED }}"
          HEAL_LOOKBACK_HOURS: "${{ env.HEAL_LOOKBACK_HOURS_RESOLVED }}"
          HEAL_STALE_10M_MINUTES: "${{ env.HEAL_STALE_10M_MINUTES_RESOLVED }}"
          HEAL_STALE_HOURLY_MINUTES: "${{ env.HEAL_STALE_HOURLY_MINUTES_RESOLVED }}"
          HEAL_COVERAGE_HOURS: "${{ env.HEAL_COVERAGE_HOURS_RESOLVED }}"
          HEAL_MAX_MISSING_10M_SLOTS: "${{ env.HEAL_MAX_MISSING_10M_SLOTS_RESOLVED }}"
          HEAL_RANK_START: "${{ env.HEAL_RANK_START_RESOLVED }}"
          HEAL_RANK_END: "${{ env.HEAL_RANK_END_RESOLVED }}"
          HEAL_GRANULARITY: "${{ env.HEAL_GRANULARITY_RESOLVED }}"
          HEAL_OVERWRITE_EXISTING: "${{ env.HEAL_OVERWRITE_EXISTING_RESOLVED }}"
          HEAL_DRY_RUN: "${{ env.HEAL_DRY_RUN_RESOLVED }}"
        run: |
          python prices/prod_pipeline/pipeline_health_runner.py \
            --script-id HE_gck_heal_anchor_if_stale \
            --scope "anchors" \
            --rank-start "${HEAL_RANK_START}" \
            --rank-end "${HEAL_RANK_END}" \
            -- python prices/prod_pipeline/HE_gck_heal_anchor_if_stale.py
