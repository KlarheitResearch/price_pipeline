name: gecko-prod-bootstrap-new-entrants-1y
# scheduler-touch: 2026-02-14

on:
  workflow_dispatch:
    inputs:
      run_bootstrap:
        description: "Run 96_bootstrap_new_entrants_1y.py"
        required: false
        default: "true"
      run_monthly_backfill:
        description: "Also run monthly backfill follow-up"
        required: false
        default: "false"
      PP_BOOTSTRAP_MAX_COINS:
        description: "Max entrant coins per run"
        required: false
        default: "20"
      PP_BOOTSTRAP_DAYS:
        description: "History days to bootstrap"
        required: false
        default: "365"
      VERBOSE_MODE:
        description: "Verbose (0/1)"
        required: false
        default: "0"
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: gecko-prod-bootstrap-new-entrants-1y-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONWARNINGS: default
      RUN_BOOTSTRAP: ${{ (github.event_name == 'schedule' && 'true') || (github.event.inputs.run_bootstrap || 'true') }}
      RUN_MONTHLY: ${{ (github.event_name == 'schedule' && 'false') || (github.event.inputs.run_monthly_backfill || 'false') }}
      PP_BOOTSTRAP_MAX_COINS_RESOLVED: ${{ github.event.inputs.PP_BOOTSTRAP_MAX_COINS || '20' }}
      PP_BOOTSTRAP_DAYS_RESOLVED: ${{ github.event.inputs.PP_BOOTSTRAP_DAYS || '365' }}
      VERBOSE_RESOLVED: ${{ github.event.inputs.VERBOSE_MODE || '0' }}
      PP_RANK_START: "1"
      PP_RANK_END: "1000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export PYTHONPATH (repo root)
        run: echo "PYTHONPATH=." >> "$GITHUB_ENV"

      - name: Astra bundle
        run: |
          echo "${{ secrets.ASTRA_BUNDLE_BASE64 }}" | base64 -d > secure-connect.zip
          test -s secure-connect.zip

      - name: Bootstrap 1y daily history for new top1000 entrants
        if: env.RUN_BOOTSTRAP == 'true'
        env:
          ASTRA_BUNDLE_PATH: secure-connect.zip
          ASTRA_TOKEN: ${{ secrets.ASTRA_TOKEN }}
          ASTRA_KEYSPACE: ${{ secrets.ASTRA_KEYSPACE }}
          COINGECKO_API_TIER: ${{ secrets.COINGECKO_API_TIER != '' && secrets.COINGECKO_API_TIER || 'demo' }}
          COINGECKO_API_KEY_AA: ${{ secrets.COINGECKO_API_KEY_AA != '' && secrets.COINGECKO_API_KEY_AA || secrets.COINGECKO_API_KEY }}
          COINGECKO_API_KEY_BB: ${{ secrets.COINGECKO_API_KEY_BB != '' && secrets.COINGECKO_API_KEY_BB || secrets.COINGECKO_API_KEY }}
          PP_BOOTSTRAP_DAYS: ${{ env.PP_BOOTSTRAP_DAYS_RESOLVED }}
          PP_BOOTSTRAP_MAX_COINS: ${{ env.PP_BOOTSTRAP_MAX_COINS_RESOLVED }}
          PP_BOOTSTRAP_OVERWRITE: "0"
          PP_BOOTSTRAP_RUN_MONTHLY_BACKFILL: ${{ env.RUN_MONTHLY }}
          VERBOSE_MODE: ${{ env.VERBOSE_RESOLVED }}
          REQUEST_TIMEOUT_SEC: "45"
        run: python prices/prod_pipeline/96_bootstrap_new_entrants_1y.py
